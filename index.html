      (function () {
        try {
          document.documentElement.setAttribute('data-folia-v6', 'on');
          var style = localStorage.getItem('folia_custom_splash_style');
          document.documentElement.setAttribute('data-folia-splash', style === 'crystal' ? 'crystal' : style === 'liquid' ? 'liquid' : 'nebula');
          var theme = localStorage.getItem('folia_custom_theme');
          if (theme) document.documentElement.setAttribute('data-folia-theme', theme);
        } catch (e) { /* 隐私模式：用默认液态玻璃 */ }
      })();

    <style>
      html, body { background-color: #141033; }
      #app-splash {
        position: fixed; inset: 0; z-index: 2147483000; overflow: hidden;

      .fs-aurora i:nth-child(1) { width: 46%; height: 38%; left: 4%;  top: 8%;  background-color: #7c5cec; animation: fs-drift-a 15s ease-in-out infinite alternate; }
      .fs-aurora i:nth-child(2) { width: 42%; height: 44%; right: 2%; top: 14%; background-color: #3fb6b0; animation: fs-drift-b 19s ease-in-out infinite alternate; }
      .fs-aurora i:nth-child(3) { width: 38%; height: 34%; left: 28%; bottom: 2%; background-color: #d06aa8; animation: fs-drift-c 22s ease-in-out infinite alternate; }
      @keyframes fs-drift-a { from { transform: translate3d(-6%, -4%, 0) scale(.9); } to { transform: translate3d(22%, 14%, 0) scale(1.18); } }
      @keyframes fs-drift-b { from { transform: translate3d(8%, 2%, 0) scale(1.1); } to { transform: translate3d(-16%, 20%, 0) scale(.86); } }

        position: absolute; width: 118px; height: 118px;

        background: linear-gradient(145deg, rgba(255,255,255,.26), rgba(255,255,255,.05) 46%, rgba(150,120,255,.12));

      @keyframes fs-ring-a { from { transform: rotateX(68deg) rotateZ(0); } to { transform: rotateX(68deg) rotateZ(360deg); } }
      @keyframes fs-ring-b { from { transform: rotateX(24deg) rotateY(62deg) rotateZ(0); } to { transform: rotateX(24deg) rotateY(62deg) rotateZ(360deg); } }

        position: absolute; inset: 0; border-radius: inherit;
        background: linear-gradient(90deg, transparent, hsl(268 90% 76%), hsl(178 84% 70%), transparent);
        background-size: 200% 100%;
        animation: fs-n-bar 1.7s ease-in-out infinite;
      }
      .fs-n-progress::after {
        content: ''; position: absolute; left: 0; top: -2px; width: 7px; height: 7px; border-radius: 50%;
        background: #fff; box-shadow: 0 0 12px 3px rgba(190, 170, 255, .8);
        animation: fs-n-dot 1.7s ease-in-out infinite;
      }
      @keyframes fs-n-bar { from { background-position: 180% 0; } to { background-position: -80% 0; } }
      @keyframes fs-n-dot { 0% { left: 0; opacity: .4; } 50% { opacity: 1; } 100% { left: calc(100% - 7px); opacity: .4; } }
      .fs-n-status { color: rgba(214, 206, 244, .72); font-size: 11px; letter-spacing: .10em; }

      @media (prefers-reduced-motion: reduce) {
        .fs-n-halo, .fs-n-disc, .fs-n-core, .fs-n-core::before, .fs-n-core::after,
        .fs-n-glyph, .fs-n-orbit, .fs-n-meteor, .fs-n-title .fs-n-char,
        .fs-n-progress i, .fs-n-progress::after { animation: none !important; }
        .fs-n-title .fs-n-char { opacity: 1; transform: none; filter: none; }
      }
    </style>
    </style>
</head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading Folia 定制版">
      <div class="fs-aurora" aria-hidden="true"><i></i><i></i><i></i></div>
      <canvas id="folia-splash-stars" aria-hidden="true"></canvas>
      <div class="app-splash-inner">

        <!-- 液态玻璃启动动画（v4 默认） -->
        <div class="fs-liquid">
          <div class="fs-glass-stage" aria-hidden="true">
            <div class="fs-refract"></div>
            <div class="fs-blob"></div>
            <div class="fs-drop fs-drop--1"></div>
            <div class="fs-drop fs-drop--2"></div>
            <div class="fs-drop fs-drop--3"></div>
          </div>
          <div class="fs-brand">
            <div class="fs-title">Folia <span>定制版</span></div>
            <div class="fs-sub">LIQUID GLASS &#183; LYRICS REIMAGINED</div>
          </div>
          <div class="fs-progress"><i></i></div>
          <div class="fs-status">正在融化玻璃与光…</div>
          <div class="fs-version">v0.7.29-custom.6</div>
        </div>

        <!-- 3D 晶体启动动画（可在快捷设置里切回） -->
      <div class="fs-nebula">
        <div class="fs-n-stage" aria-hidden="true">
          <div class="fs-n-halo"></div>
          <div class="fs-n-disc"></div>
          <div class="fs-n-orbit fs-n-orbit--a"></div>
          <div class="fs-n-orbit fs-n-orbit--b"></div>
          <div class="fs-n-orbit fs-n-orbit--c"></div>
          <div class="fs-n-core"><div class="fs-n-glyph">&#10022;</div></div>
          <div class="fs-n-meteor fs-n-meteor--1"></div>
          <div class="fs-n-meteor fs-n-meteor--2"></div>
          <div class="fs-n-meteor fs-n-meteor--3"></div>
        </div>
        <div class="fs-n-title" aria-label="Folia 定制版">
          <span class="fs-n-char">F</span><span class="fs-n-char">o</span><span class="fs-n-char">l</span><span class="fs-n-char">i</span><span class="fs-n-char">a</span>
          <span class="fs-n-char">&nbsp;</span><span class="fs-n-char">定</span><span class="fs-n-char">制</span><span class="fs-n-char">版</span>
        </div>
        <div class="fs-n-sub">NEBULA &#183; LYRICS REIMAGINED</div>
        <div class="fs-n-progress"><i></i></div>
        <div class="fs-n-status">正在点亮星云…</div>
        <div class="fs-version">v0.7.29-custom.6</div>
      </div>
        <div class="fs-crystal">
          <div class="fs-stage" aria-hidden="true">
            <div class="fs-ring fs-ring--a"></div>
            <div class="fs-ring fs-ring--b"></div>
            <div class="fs-ring fs-ring--c"></div>
            <div class="fs-cube">
              <div class="fs-face fs-face--front"><div class="fs-glyph">&#10022;</div></div>
              <div class="fs-face fs-face--back"></div>
              <div class="fs-face fs-face--right"></div>
              <div class="fs-face fs-face--left"></div>
              <div class="fs-face fs-face--top"></div>
              <div class="fs-face fs-face--bottom"></div>
            </div>
            <div class="fs-core"></div>
          </div>
          <div class="fs-brand">
            <div class="fs-title">Folia <span>定制版</span></div>
            <div class="fs-sub">LYRICS REIMAGINED &#183; 3D</div>
          </div>
          <div class="fs-progress"><i></i></div>
          <div class="fs-status">正在准备歌词舞台…</div>
          <div class="fs-version">v0.7.29-custom.6</div>
        </div>

      </div>
    </div>
    <script>
      (function () {
        // v5：跳过启动动画 —— 首帧直接摘掉，不等 React 挂载、不等最短展示时长。
        try {
          if (localStorage.getItem('folia_custom_skip_splash') === '1') {
            document.documentElement.setAttribute('data-folia-skip-splash', 'true');
            var sSkip = document.getElementById('app-splash');
            if (sSkip) sSkip.remove();
            return;
          }
        } catch (e) { /* 隐私模式：正常播放动画 */ }

        try {
          // 透明背景入口（OBS 源 / 壁纸窗口）不盖启动层。
          var params = new URLSearchParams(window.location.search);
          if (params.get('obs') === '1' || window.location.pathname === '/obs' || params.get('splash') === '0') {
            var s0 = document.getElementById('app-splash');
            if (s0) s0.remove();
            return;
          }
        } catch (error) { /* 保留启动层，React 挂载后仍会移除 */ }

        // 星尘粒子：轻量 canvas，遮罩移除后自动停帧，不占主界面资源。
        var canvas = document.getElementById('folia-splash-stars');
        var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
        if (ctx) {
          var w = 0, h = 0, stars = [], dpr = Math.min(window.devicePixelRatio || 1, 2);
          function resize() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            stars = [];
            var isNeb = document.documentElement.getAttribute('data-folia-splash') === 'nebula';
            var count = Math.min(isNeb ? 96 : 64, Math.round(w * h / (isNeb ? 10000 : 14000)));
            for (var i = 0; i < count; i++) {
              stars.push({
                x: Math.random() * w, y: Math.random() * h,
                r: Math.random() * 1.5 + 0.4,
                a: Math.random() * 0.55 + 0.15,
                vy: -(Math.random() * 0.22 + 0.05),
                tw: Math.random() * Math.PI * 2
              });
            }
          }
          var last = 0;
          function frame(ts) {
            if (!document.getElementById('app-splash')) return;
            window.requestAnimationFrame(frame);
            // v5：星尘锁 30fps，页面隐藏时完全不绘制
            if (document.hidden || ts - last < 33) return;
            last = ts;
            ctx.clearRect(0, 0, w, h);
            for (var i = 0; i < stars.length; i++) {
              var s = stars[i];
              s.y += s.vy; s.tw += 0.02;
              if (s.y < -4) { s.y = h + 4; s.x = Math.random() * w; }
              var alpha = s.a * (0.65 + 0.35 * Math.sin(s.tw));
              ctx.beginPath();
              ctx.fillStyle = 'rgba(214,202,255,' + alpha.toFixed(3) + ')';
              ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          resize();
          window.addEventListener('resize', resize);
          window.requestAnimationFrame(frame);
        }
      })();

      // 12 秒兜底：模块包 / React 一直没挂上时给出可点按的重试，而不是空白页。
      window.setTimeout(function () {
        var splash = document.getElementById('app-splash');
        if (!splash) return;
        splash.innerHTML =
          '<div style="display:flex;flex-direction:column;align-items:center;gap:14px;' +
          'color:#f2efff;font:14px/1.6 system-ui,sans-serif;text-align:center;padding:24px">' +
          '<div style="font-size:18px;font-weight:600">启动超时</div>' +
          '<div style="opacity:.72">点按重新加载 / Tap to reload</div></div>';
        splash.style.cursor = 'pointer';
        splash.addEventListener('click', function () { window.location.reload(); });
      }, 12000);
    </script>

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
