name: 构建 Folia 定制版 APK

# push 到 main 就自动编译；编好的 APK 会自动回推到仓库的 apk/ 目录。
# 你只需要：push 一次 → 等约 20 分钟 → 跑 python 取回APK.py
on:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - '输出APK/**'
      - 'Folia定制版-v6.apk'
      - 'versions/**'
      - 'README.md'
      - '构建诊断.txt'
  workflow_dispatch:
    inputs:
      note:
        description: '本次构建备注（可留空）'
        required: false
        default: ''
      fast:
        description: '跳过启动引导（true/false）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: folia-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 展开 v6 完整源码（云端 runner 本地磁盘，秒级完成）
        run: |
          ZIP=versions/v6/Folia-v6-完整工程.zip
          test -f "$ZIP" || { echo "缺少 v6 源码包"; exit 1; }
          python3 - <<'PY'
          import zipfile, os
          z = zipfile.ZipFile('versions/v6/Folia-v6-完整工程.zip')
          n = 0
          for info in z.infolist():
              name = info.filename
              if info.is_dir() or name.startswith('.github/') or name == 'README.md':
                  continue
              z.extract(info, '.')
              n += 1
          print('展开源码文件数:', n)
          os.chmod('android/gradlew', 0o755)
          PY
          sed -i 's#https://mirrors.cloud.tencent.com/gradle/#https://services.gradle.org/distributions/#' android/gradle/wrapper/gradle-wrapper.properties || true
          test -f package.json && test -f android/gradlew && test -f capacitor.config.json
          echo "构建版本:"; grep -m1 '"version"' package.json || true

      - name: 准备 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 缓存 NDK / CMake
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk
            ${{ env.ANDROID_HOME }}/cmake
          key: android-ndk-28.2.13676358-cmake-3.22.1-v6

      - name: 安装 SDK / NDK / CMake
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          if ! command -v sdkmanager >/dev/null; then
            SDKM=$(find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager -type f | head -1)
            echo "fallback sdkmanager: $SDKM"
            export PATH="$(dirname "$SDKM"):$PATH"
          fi
          command -v sdkmanager || { echo "sdkmanager 缺失"; exit 1; }
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" \
            2>&1 | tee sdk-install.log
          if ! sdkmanager --install "ndk;28.2.13676358" 2>&1 | tee -a sdk-install.log; then
            echo "⚠️ 指定 NDK 不可用，改用预装 NDK"
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            echo "使用 NDK: $NDK"
            sed -i "s|ndkVersion \".*\"|ndkVersion \"$(basename "$NDK")\"|" android/app/build.gradle
          fi
          sdkmanager --list | head -25

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/ 2>&1 | tee npm-ci.log

      - name: 构建 Web 资源
        run: |
          if [ "${{ github.event.inputs.fast }}" = "true" ]; then
            npm run build:capacitor:fast 2>&1 | tee vite-build.log
          else
            npm run build:capacitor 2>&1 | tee vite-build.log
          fi

      - name: 同步 Capacitor 工程
        run: npx cap sync android 2>&1 | tee cap-sync.log

      - name: 生成发布签名
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore app/folia-custom.keystore \
            -alias folia-custom -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass folia2026 -keypass folia2026 \
            -dname "CN=Folia Custom, OU=Personal, O=Personal, L=NA, S=NA, C=CN"
          cat > keystore.properties <<'EOF'
          storeFile=folia-custom.keystore
          storePassword=folia2026
          keyAlias=folia-custom
          keyPassword=folia2026
          EOF

      - name: 编译 Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: 整理产物
        run: |
          mkdir -p 输出APK apk
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" 输出APK/Folia定制版-v6.apk
          cp "$APK" apk/Folia定制版-v6.apk
          ls -lh apk/

      - name: 上传 Artifact（保底）
        uses: actions/upload-artifact@v4
        with:
          name: Folia-定制版-v6-APK
          path: 输出APK/Folia定制版-v6.apk
          if-no-files-found: error

      - name: 把 APK 自动回推仓库
        run: |
          git config user.name "folia-build-bot"
          git config user.email "folia-build-bot@users.noreply.github.com"
          git add -f apk/Folia定制版-v6.apk
          if git diff --cached --quiet; then
            echo "APK 未变化，跳过回推"
          else
            git commit -m "chore: 自动回推编译产物 [skip ci]"
            git push origin HEAD:main
          fi

      - name: 把 v6 完整源码树回推仓库
        if: success()
        continue-on-error: true
        run: |
          # 清掉构建期临时文件与签名私钥，绝不提交密钥
          rm -f sdk-install.log npm-ci.log vite-build.log cap-sync.log gradle-build.log 构建诊断.txt
          rm -f android/app/folia-custom.keystore android/keystore.properties
          rm -rf android/app/build android/build android/.gradle dist node_modules 输出APK
          git config user.name "folia-build-bot"
          git config user.email "folia-build-bot@users.noreply.github.com"
          git add -A
          git add -f apk/Folia定制版-v6.apk 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "源码树与 APK 均无变化"
          else
            git commit -m "chore: v6 完整源码树与编译产物 [skip ci]"
            git push origin HEAD:main || echo "源码回推失败（不影响已上传的 APK）"
          fi

      - name: 失败诊断回推
        if: failure()
        run: |
          {
            echo "=== 根目录 ==="; ls -la | head -40
            echo "=== zip 完整性 ==="; unzip -t folia-project.zip 2>&1 | tail -6
            echo "=== 关键文件 ==="; for f in package.json package-lock.json capacitor.config.json android/gradlew android/app/build.gradle; do test -f "$f" && echo "OK $f" || echo "MISSING $f"; done
            echo "=== 最近日志 ==="; find android -name '*.log' -o -name 'output.txt' 2>/dev/null | head -5
            for f in sdk-install.log npm-ci.log vite-build.log cap-sync.log gradle-build.log; do
              if [ -f "$f" ]; then echo "=== $f 尾部 ==="; tail -70 "$f"; fi
            done
            echo "=== 磁盘 ==="; df -h . | tail -2
            echo "=== 源码包 ==="; ls -lh versions/v6/ 2>/dev/null | head -10
          } > 构建诊断.txt 2>&1 || true
          git config user.name "folia-build-bot"
          git config user.email "folia-build-bot@localhost"
          git add -f 构建诊断.txt
          git commit -m "chore: 构建诊断 [skip ci]" || true
          git push origin HEAD:main || true

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 构建日志
          path: |
            android/app/build/outputs/logs/
            android/.gradle/
          if-no-files-found: ignore
